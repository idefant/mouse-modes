name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate tag and require release notes
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          node --input-type=module -e '
            import { parseVersion } from "./scripts/release-utils.mjs";
            import fs from "node:fs";
            const version = parseVersion(process.env.RELEASE_TAG);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          '
          node scripts/extract-changelog.mjs "$RELEASE_TAG" > release-notes.md
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,rpm
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install Linux development dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-ci-deps.sh
      - name: Sync version from release tag
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: node scripts/set-version.mjs "$RELEASE_VERSION"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:release
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Remove cached installer artifacts
        run: |
          node --input-type=module -e "import fs from 'node:fs'; fs.rmSync('src-tauri/target/release/bundle', { recursive: true, force: true });"
      - name: Build installers
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BUNDLES: ${{ matrix.bundles }}
        shell: bash
        run: |
          # Tauri's RPM packager rejects hyphens in prerelease versions.
          if [[ "$RUNNER_OS" == Linux && "$RELEASE_VERSION" == *-* ]]; then
            BUNDLES=deb
          fi
          npm run tauri build -- --bundles "$BUNDLES"
      - name: Build native Arch installer
        if: runner.os == 'Linux'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_VERSION" == *-* ]]; then exit 0; fi
          build_dir="$RUNNER_TEMP/mouse-modes-arch"
          mkdir -p "$build_dir" src-tauri/target/release/bundle/arch
          python3 scripts/prepare-arch-package.py src-tauri/target/release/bundle/deb/*.deb "$build_dir"
          docker run --rm -v "$build_dir:/source:ro" -v "$PWD/src-tauri/target/release/bundle/arch:/output" archlinux:base-devel bash -c '
            set -e
            useradd -m builder
            cp -a /source /home/builder/build
            chown -R builder:builder /home/builder/build
            cd /home/builder/build
            runuser -u builder -- makepkg --nodeps --nocheck --noconfirm
            cp mouse-modes-*.pkg.tar.zst /output/
          '
      - name: Verify Linux installer contents
        if: runner.os == 'Linux'
        run: python3 scripts/check-linux-packages.py src-tauri/target/release/bundle
      - name: Test clean Linux installation and removal
        if: runner.os == 'Linux'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/src-tauri/target/release/bundle:/packages:ro" -v "$PWD/scripts:/checks:ro" ubuntu:24.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends python3
            python3 /checks/test-linux-install.py deb /packages
          '
          if [[ "$RELEASE_VERSION" != *-* ]]; then
            docker run --rm -v "$PWD/src-tauri/target/release/bundle:/packages:ro" -v "$PWD/scripts:/checks:ro" fedora:44 bash -c '
              set -e
              dnf -y install python3 util-linux shadow-utils
              python3 /checks/test-linux-install.py rpm /packages
            '
            docker run --rm -v "$PWD/src-tauri/target/release/bundle:/packages:ro" -v "$PWD/scripts:/checks:ro" archlinux:base-devel bash -c '
              set -e
              pacman -Syu --noconfirm python
              python /checks/test-linux-install.py arch /packages
            '
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/arch/*.pkg.tar.zst
            src-tauri/target/release/bundle/nsis/*.exe
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/extract-changelog.mjs "$RELEASE_VERSION" > release-notes.md
          # GitHub replaces spaces in uploaded asset names with dots.
          while IFS= read -r -d '' file; do
            mv "$file" "${file// /.}"
          done < <(find installers -type f -name '* *' -print0)
          mapfile -d '' files < <(find installers -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -print0)
          expected=4
          if [[ "$RELEASE_VERSION" == *-* ]]; then expected=2; fi
          test "${#files[@]}" -eq "$expected"
          sha256sum "${files[@]}" | sed 's|  installers/.*/|  |' > installers/SHA256SUMS
          flags=(--latest)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Mouse Modes $RELEASE_VERSION" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" installers/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --notes-file release-notes.md "${flags[@]}"
