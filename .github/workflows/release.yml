name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate tag and require release notes
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          node --input-type=module -e '
            import { parseVersion } from "./scripts/release-utils.mjs";
            import fs from "node:fs";
            const version = parseVersion(process.env.RELEASE_TAG);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          '
          node scripts/extract-changelog.mjs "$RELEASE_TAG" > release-notes.md
  build:
    needs: prepare
    uses: ./.github/workflows/check.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/extract-changelog.mjs "$RELEASE_VERSION" > release-notes.md
          # GitHub replaces spaces in uploaded asset names with dots.
          while IFS= read -r -d '' file; do
            mv "$file" "${file// /.}"
          done < <(find installers -type f -name '* *' -print0)
          mapfile -d '' files < <(find installers -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -print0)
          expected=4
          if [[ "$RELEASE_VERSION" == *-* ]]; then expected=2; fi
          test "${#files[@]}" -eq "$expected"
          sha256sum "${files[@]}" | sed 's|  installers/.*/|  |' > installers/SHA256SUMS
          flags=(--latest)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Mouse Modes $RELEASE_VERSION" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" installers/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --notes-file release-notes.md "${flags[@]}"
