name: Build and check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,rpm
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev rpm
      - name: Sync version from release tag
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: node scripts/set-version.mjs "$RELEASE_VERSION"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:release
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build application
        if: inputs.version == ''
        run: npm run tauri build -- --no-bundle
      - name: Build installers
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUNDLES: ${{ matrix.bundles }}
        shell: bash
        run: |
          # Tauri's RPM packager rejects hyphens in prerelease versions.
          if [[ "$RUNNER_OS" == Linux && "$RELEASE_VERSION" == *-* ]]; then
            BUNDLES=deb
          fi
          npm run tauri build -- --bundles "$BUNDLES"
      - uses: actions/upload-artifact@v4
        if: inputs.version == ''
        with:
          name: mouse-modes-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/mouse-modes
            src-tauri/target/release/mouse-modes.exe
      - uses: actions/upload-artifact@v4
        if: inputs.version != ''
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe
